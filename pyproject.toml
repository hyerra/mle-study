[project]
name = "mle-study"
version = "0.1.0"
description = "A personal scratchpad for implementing math, linear algebra, classical ML, deep learning, and MLE topics from scratch"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "altair>=6.1.0",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "kagglehub>=1.0.1",
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "scikit-learn>=1.8.0",
    "xgboost>=3.2.0",
]

[tool.uv]
# kagglehub 1.0.1 imports get_web_endpoint from kagglesdk.kaggle_env, which was
# removed in kagglesdk 0.1.24. kagglehub's own pin (>=0.1.22) is too loose, so
# cap the transitive dep at the last compatible release.
constraint-dependencies = ["kagglesdk<0.1.24"]

[tool.ruff]
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "nbstripout>=0.9.1",
    "ruff>=0.15.9",
]
