[project]
name = "mle-study"
version = "0.1.0"
description = "A personal scratchpad for implementing math, linear algebra, classical ML, deep learning, and MLE topics from scratch"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
]

[tool.ruff]
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "nbstripout>=0.9.1",
    "ruff>=0.15.9",
]
